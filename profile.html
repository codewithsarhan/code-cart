<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Code Cart</title>
    <link rel="stylesheet" href="profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Container for Login -->
    <div class="auth-container" id="authContainer">
        
        <!-- Login Form Box -->
        <div class="auth-box" id="login-box">
            <h2 id="loginTitle">Welcome Back</h2>
            <p class="subtitle" id="loginSubtitle">Login to your account</p>

            <form action="#" id="loginForm">
                <div class="input-group" id="inputGroupEmail">
                    <label for="login-email" id="labelLoginEmail">Email Address Or Number</label>
                    <input type="email" id="login-email" placeholder="Login Email Or Number">
                </div>

                <div class="input-group" id="inputGroupPassword">
                    <label for="login-password" id="labelLoginPassword">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Login</button>
            </form>

            <p class="switch-text" id="switchText">
                Don't have an account? 
                <a href="#" id="show-signup">Create Account</a>
            </p>
        </div>

    </div>

    <script src="profile.js"></script>
</body>
</html>
