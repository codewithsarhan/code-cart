<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Project - CodeCart</title>
    <link rel="stylesheet" href="orderForm.css">
</head>
<body>

    <main class="order-container" id="orderContainer">
        <header class="form-header" id="formHeader">
            <h1 class="brand-title" id="brandTitle">Code<span>Cart</span></h1>
            <p class="subtitle" id="subtitle">Select your website type and place your custom order</p>
        </header>

        <form class="order-form" id="projectOrderForm">
            
            <!-- Section 1: Personal Details -->
            <section class="form-section" id="formSectionPersonal">
                <h2 class="section-title" id="sectionTitlePersonal">Personal Information</h2>
                <div class="input-grid" id="inputGrid">
                    <div class="input-group" id="inputGroupFullName">
                        <label for="fullName" id="labelFullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>
                    </div>

                    <div class="input-group" id="inputGroupEmail">
                        <label for="email" id="labelEmail">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required>
                    </div>

                    <div class="input-group full-width" id="inputGroupPhone">
                        <label for="phone" id="labelPhone">Phone / WhatsApp Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+92 300 1234567" required>
                    </div>
                </div>
            </section>

            <!-- Section 2: Website Type Selection -->
            <section class="form-section" id="formSectionServices">
                <h2 class="section-title" id="sectionTitleServices">Select Website Type</h2>
                <div class="services-grid" id="servicesGrid">
                    
                    <label class="service-card" id="serviceCard1">
                        <input type="radio" name="websiteType" value="50" data-name="E-Commerce Website">
                        <div class="card-content" id="cardContent1">
                            <h3 id="serviceTitle1">E-Commerce Store</h3>
                            <p class="desc" id="serviceDesc1">Online store with payment & product management</p>
                            <div class="price" id="servicePrice1">$50</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard2">
                        <input type="radio" name="websiteType" value="80" data-name="Business Website">
                        <div class="card-content" id="cardContent2">
                            <h3 id="serviceTitle2">Business Website</h3>
                            <p class="desc" id="serviceDesc2">Professional corporate site for modern brands</p>
                            <div class="price" id="servicePrice2">$80</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard3">
                        <input type="radio" name="websiteType" value="60" data-name="Portfolio Website">
                        <div class="card-content" id="cardContent3">
                            <h3 id="serviceTitle3">Portfolio Website</h3>
                            <p class="desc" id="serviceDesc3">Personal showcase for developers & creators</p>
                            <div class="price" id="servicePrice3">$60</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard4">
                        <input type="radio" name="websiteType" value="100" data-name="SaaS Application">
                        <div class="card-content" id="cardContent4">
                            <h3 id="serviceTitle4">SaaS Application</h3>
                            <p class="desc" id="serviceDesc4">Web app platform with user authentication</p>
                            <div class="price" id="servicePrice4">$100</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard5">
                        <input type="radio" name="websiteType" value="45" data-name="Landing Page">
                        <div class="card-content" id="cardContent5">
                            <h3 id="serviceTitle5">Landing Page</h3>
                            <p class="desc" id="serviceDesc5">High-converting single page for lead generation</p>
                            <div class="price" id="servicePrice5">$45</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard6">
                        <input type="radio" name="websiteType" value="70" data-name="Blog / News Portal">
                        <div class="card-content" id="cardContent6">
                            <h3 id="serviceTitle6">Blog / News Portal</h3>
                            <p class="desc" id="serviceDesc6">Content platform with categories & CMS setup</p>
                            <div class="price" id="servicePrice6">$70</div>
                        </div>
                    </label>

                    <label class="service-card" id="serviceCard7">
                        <input type="radio" name="websiteType" value="120" data-name="Custom Web Application">
                        <div class="card-content" id="cardContent7">
                            <h3 id="serviceTitle7">Custom Web App</h3>
                            <p class="desc" id="serviceDesc7">Bespoke dashboard, MERN app, or API system</p>
                            <div class="price" id="servicePrice7">$120</div>
                        </div>
                    </label>

                </div>
            </section>

            <!-- Order Summary & Submit CTA -->
            <div class="order-summary-box" id="orderSummaryBox">
                <div class="summary-details" id="summaryDetails">
                    <span id="summaryText">Total Investment:</span>
                    <span class="total-price" id="totalPrice">$50</span>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    Complete & Place Order Now
                </button>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="orderForm.js"></script>
</body>
</html>
