<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Item - CodeCart</title>
    <link rel="stylesheet" href="cartItem.css">
</head>
<body>

    <main class="order-container" id="orderContainer">
        <article class="product-card" id="productCard">
            <header class="card-header" id="cardHeader">
                <h3 class="order-title" id="orderTitle">Order By <span class="user-name" id="userName"></span></h3>
                <span class="badge" id="badge">New Order</span>
            </header>

            <div class="card-body" id="cardBody">
                <div class="info-group" id="infoGroupEmail">
                    <span class="label" id="labelEmail">Email</span>
                    <span class="value order-email" id="orderEmail">xyz@example.com</span>
                </div>
                
                <div class="info-group" id="infoGroupPhone">
                    <span class="label" id="labelPhone">Phone No</span>
                    <span class="value user-phone" id="userPhone">+92 300 1234567</span>
                </div>

                <div class="product-details" id="productDetails">
                    <h4 class="product-name" id="productName"><span class="product-title-span" id="productTitleSpan"></span></h4>
                    <p class="product-desc" id="productDesc"><span class="product-disc" id="productDisc"></span></p>
                </div>
            </div>

            <footer class="card-footer" id="cardFooter">
                <div class="price-box" id="priceBox">
                    <span class="price-label" id="priceLabel">Total Price</span>
                    <span class="price-value product-price" id="productPrice"></span>
                </div>
                <div class="status-box" id="statusBox">
                    <span class="status-label" id="statusLabel">Status :</span>
                    <span class="status-value" id="statusValue"></span>
                </div>
            </footer>
        </article>

        <div class="card-actions" id="cardActions">
            <button type="button" class="btn btn-add" id="btnAdd">Add</button>
            <button type="button" class="btn btn-remove" id="btnRemove">Remove</button>
        </div>
    </main>

    <script src="cartItem.js"></script>
</body>
</html>
