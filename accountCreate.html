<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CodeCart</title>
    <!-- Tailwind build output (same as before) -->
    <link rel="stylesheet" href="./dist/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="font-['Poppins',sans-serif] bg-[#f8f9fa] text-[#1a1a1a] flex justify-center items-center min-h-screen antialiased p-5">

    <!-- Main Container for Signup -->
    <div class="auth-container w-full max-w-[420px]" id="authContainer">

        <!-- Signup Form Box -->
        <div class="auth-box bg-white py-10 px-[30px] rounded-lg shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-[#e2e5e9]"
            id="signup-box">
            <h2 class="text-2xl text-[#1a1a1a] mb-[5px] text-center" id="signupTitle">Create Account</h2>
            <p class="subtitle text-sm text-[#555555] text-center mb-[25px]" id="signupSubtitle">Sign up to get started
                with CodeCart</p>

            <form action="#" id="signupForm">

                <div class="input-group mb-[18px]" id="inputGroupName">
                    <label for="signup-name"
                        class="block text-sm text-[#1a1a1a] mb-[6px] font-medium" id="labelSignupName">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Enter your full name" required
                        class="w-full px-[15px] py-3 border border-[#e2e5e9] rounded-md text-sm font-['Poppins',sans-serif] bg-[#f8f9fa] text-[#1a1a1a] outline-none focus:border-[#1a1a1a]">
                </div>

                <div class="input-group mb-[18px]" id="inputGroupEmail">
                    <label for="signup-email"
                        class="block text-sm text-[#1a1a1a] mb-[6px] font-medium" id="labelSignupEmail">Email Address Or
                        Number</label>
                    <input type="text" id="signup-email" placeholder="Enter email or phone number" required
                        class="w-full px-[15px] py-3 border border-[#e2e5e9] rounded-md text-sm font-['Poppins',sans-serif] bg-[#f8f9fa] text-[#1a1a1a] outline-none focus:border-[#1a1a1a]">
                </div>

                <div class="input-group mb-[18px]" id="inputGroupPassword">
                    <label for="signup-password"
                        class="block text-sm text-[#1a1a1a] mb-[6px] font-medium"
                        id="labelSignupPassword">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a strong password" required
                        class="w-full px-[15px] py-3 border border-[#e2e5e9] rounded-md text-sm font-['Poppins',sans-serif] bg-[#f8f9fa] text-[#1a1a1a] outline-none focus:border-[#1a1a1a]">
                </div>

                <div class="input-group mb-[18px]" id="inputGroupConfirmPassword">
                    <label for="signup-confirm-password"
                        class="block text-sm text-[#1a1a1a] mb-[6px] font-medium"
                        id="labelSignupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required
                        class="w-full px-[15px] py-3 border border-[#e2e5e9] rounded-md text-sm font-['Poppins',sans-serif] bg-[#f8f9fa] text-[#1a1a1a] outline-none focus:border-[#1a1a1a]">
                </div>

                <button type="submit"
                    class="btn-primary w-full py-3 bg-[#1a1a1a] text-white border-none rounded-md text-base font-medium cursor-pointer font-['Poppins',sans-serif] mt-[5px] hover:bg-black"
                    id="signupBtn">Sign Up</button>
            </form>

            <p class="switch-text text-center mt-5 text-sm text-[#555555]" id="switchText">
                Already have an account?
                <a href="#" class="text-[#1a1a1a] no-underline font-semibold hover:underline" id="show-login">Login</a>
            </p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="accountCreate.js"></script>
</body>
</html>
